<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f4f5ed"/><text xml:space="preserve" x="46" y="40" fill="#182922" font-size="19" font-family="monospace">VECTOR CE / CALCULATOR WALKTHROUGH</text><text xml:space="preserve" x="1115" y="40" fill="#182922" font-size="19" font-family="monospace">27 / 40</text><rect x="192" y="70" width="896" height="548" rx="20" fill="#25352f"/><svg x="216" y="80" width="848" height="528" viewBox="0 0 265 165"><rect width="265" height="165" fill="#fcfdf6"/><text xml:space="preserve" x="3" y="14" fill="#182922" font-size="15.5" font-family="monospace">DIRECTION / QUADRANT      </text><text xml:space="preserve" x="3" y="30" fill="#182922" font-size="15.5" font-family="monospace">--------------------------</text><text xml:space="preserve" x="3" y="46" fill="#182922" font-size="15.5" font-family="monospace">ANGLE=ATAN(Y/X)           </text><text xml:space="preserve" x="3" y="62" fill="#182922" font-size="15.5" font-family="monospace">X&lt;0: ADD 180              </text><text xml:space="preserve" x="3" y="78" fill="#182922" font-size="15.5" font-family="monospace">IF NEGATIVE: ADD 360      </text><text xml:space="preserve" x="3" y="94" fill="#182922" font-size="15.5" font-family="monospace">                          </text><text xml:space="preserve" x="3" y="110" fill="#182922" font-size="15.5" font-family="monospace">X=0: 90 NORTH, 270 SOUTH  </text><text xml:space="preserve" x="3" y="126" fill="#182922" font-size="15.5" font-family="monospace">ZERO: NO DEFINED ANGLE    </text><text xml:space="preserve" x="3" y="142" fill="#182922" font-size="15.5" font-family="monospace">                          </text><text xml:space="preserve" x="3" y="158" fill="#182922" font-size="15.5" font-family="monospace">ENTER NEXT / CLEAR BACK   </text></svg><text xml:space="preserve" x="46" y="650" fill="#182922" font-size="23" font-family="monospace">Handle the correct quadrant</text><text xml:space="preserve" x="46" y="678" fill="#182922" font-size="17" font-family="monospace">Axis cases and negative x values have explicit handling.</text><text xml:space="preserve" x="46" y="707" fill="#182922" font-size="13" font-family="monospace">SOURCE-LAYOUT SIMULATION / APPROXIMATE FONTS / NOT HARDWARE OR EMULATOR FOOTAGE</text><text xml:space="preserve" x="1110" y="97" fill="#182922" font-size="11" font-family="monospace">KEY / ACTION</text><text xml:space="preserve" x="1110" y="119" fill="#182922" font-size="11" font-family="monospace">ENTER: next / CLEAR:</text></svg>