<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f4f5ed"/><text xml:space="preserve" x="46" y="40" fill="#182922" font-size="19" font-family="monospace">VECTOR CE / CALCULATOR WALKTHROUGH</text><text xml:space="preserve" x="1115" y="40" fill="#182922" font-size="19" font-family="monospace">28 / 40</text><rect x="192" y="70" width="896" height="548" rx="20" fill="#25352f"/><svg x="216" y="80" width="848" height="528" viewBox="0 0 265 165"><rect width="265" height="165" fill="#fcfdf6"/><text xml:space="preserve" x="3" y="14" fill="#182922" font-size="15.5" font-family="monospace">ANGLE / SUBSTITUTION      </text><text xml:space="preserve" x="3" y="30" fill="#182922" font-size="15.5" font-family="monospace">--------------------------</text><text xml:space="preserve" x="3" y="46" fill="#182922" font-size="15.5" font-family="monospace">ATAN(Y/X), THEN FIX QUAD  </text><text xml:space="preserve" x="3" y="62" fill="#182922" font-size="15.5" font-family="monospace">                          </text><text xml:space="preserve" x="3" y="78" fill="#182922" font-size="15.5" font-family="monospace">Y      4                  </text><text xml:space="preserve" x="3" y="94" fill="#182922" font-size="15.5" font-family="monospace">X      3                  </text><text xml:space="preserve" x="3" y="110" fill="#182922" font-size="15.5" font-family="monospace">                          </text><text xml:space="preserve" x="3" y="126" fill="#182922" font-size="15.5" font-family="monospace">DEG =  53.13010235        </text><text xml:space="preserve" x="3" y="142" fill="#182922" font-size="15.5" font-family="monospace">                          </text><text xml:space="preserve" x="3" y="158" fill="#182922" font-size="15.5" font-family="monospace">ENTER NEXT / CLEAR BACK   </text></svg><text xml:space="preserve" x="46" y="650" fill="#182922" font-size="23" font-family="monospace">Substitute the components</text><text xml:space="preserve" x="46" y="678" fill="#182922" font-size="17" font-family="monospace">Use atan(4/3), then apply the appropriate quadrant correction.</text><text xml:space="preserve" x="46" y="707" fill="#182922" font-size="13" font-family="monospace">SOURCE-LAYOUT SIMULATION / APPROXIMATE FONTS / NOT HARDWARE OR EMULATOR FOOTAGE</text><text xml:space="preserve" x="1110" y="97" fill="#182922" font-size="11" font-family="monospace">KEY / ACTION</text><text xml:space="preserve" x="1110" y="119" fill="#182922" font-size="11" font-family="monospace">ENTER: next / CLEAR:</text></svg>